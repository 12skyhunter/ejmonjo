<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | EJ Monjo Carpintería</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Work+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Work Sans"', 'sans-serif'],
            serif: ['"DM Sans"', 'serif'],
          },
          colors: {
            brand: {
              50: '#fbf9f8',
              100: '#f5f0ed',
              600: '#8B5E3C',
              700: '#5d4037',
              800: '#442a22',
              900: '#2c160e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f9f9f8] text-[#1a1c1c] font-sans antialiased flex flex-col min-h-screen">

  <div id="header-container"></div>

  <main class="flex-grow flex items-center justify-center py-20 px-4 text-center">
    <div class="max-w-md mx-auto">
      <span class="text-6xl sm:text-7xl font-serif font-bold text-[#8B5E3C] block mb-4">404</span>
      <h1 class="text-2xl sm:text-3xl font-serif font-bold text-[#2c160e] mb-3">Página no encontrada</h1>
      <p class="text-sm text-[#5c5f5e] mb-8 leading-relaxed">
        La página que estás buscando no existe o fue reubicada. Te invitamos a conocer nuestras obras o regresar a la página principal.
      </p>
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <a 
          href="/ejmonjo/" 
          class="w-full sm:w-auto bg-[#5d4037] hover:bg-[#8B5E3C] text-white text-xs font-semibold uppercase tracking-wider py-3 px-6 rounded-xl transition-colors"
        >
          Volver al Inicio
        </a>
        <a 
          href="/ejmonjo/portafolio" 
          class="w-full sm:w-auto bg-white border border-[#e5dedb] hover:bg-[#eee8e5] text-[#2c160e] text-xs font-semibold uppercase tracking-wider py-3 px-6 rounded-xl transition-colors"
        >
          Ver Portafolio
        </a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/ejmonjo/js/data.js"></script>
  <script src="/ejmonjo/js/layout.js"></script>
</body>
</html>
