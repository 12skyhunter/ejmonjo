name: Deploy ejmonjo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy via Rsync
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Sincronizar el contenido de public_html al servidor en ejmonjocarpinteria.com
        rsync -avz --exclude='.git' --exclude='.github' --exclude='cgi-bin' --exclude='.DS_Store' --exclude='awstats*' --exclude='icon' --delete \
          -e "ssh -i ~/.ssh/deploy_key -p 9338 -o StrictHostKeyChecking=no" \
          public_html/ ejmonjocarpinteria@$SERVER_IP:/home/ejmonjocarpinteria/public_html/
